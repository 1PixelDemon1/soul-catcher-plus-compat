// This is a minimal setup of a Forge mod workspace.
// For complex examples (including AccessTransformers, Jar-in-Jar, and Mixin), see our examples repository.
// https://github.com/MinecraftForge/MDKExamples

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = mod_version
group = mod_group_id
base { archivesName = 'soulcatcherplus-compat' }
layout.buildDirectory = layout.projectDirectory.dir('build/26.3')
java.withSourcesJar()

// Mojang ships Java 25 to end users in 26.1+, so your mod should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Include generated resources
sourceSets.main.resources { srcDir 'src/generated/resources' }

def localSettings = new Properties()
def localSettingsFile = file('local.properties')
if (localSettingsFile.isFile()) localSettingsFile.withReader('UTF-8') { localSettings.load(it) }
def corePath = providers.gradleProperty('soulcatcherplusJar').getOrElse(localSettings.getProperty('soulcatcherplusJar', ''))
if (!corePath.trim()) {
    throw new GradleException('Set soulcatcherplusJar in local.properties (see local.properties.example), or pass -PsoulcatcherplusJar=<path>.')
}
def coreJar = file(corePath)
if (!coreJar.isFile() || !coreJar.name.toLowerCase().endsWith('.jar')) {
    throw new GradleException("Soul Catcher Plus JAR not found: ${coreJar}. Use an installable JAR, not a sources/dev JAR.")
}

// Check the actual mod metadata, independently of the selected filename.
new java.util.jar.JarFile(coreJar).withCloseable { archive ->
    def entry = archive.getJarEntry('META-INF/mods.toml')
    if (entry == null) throw new GradleException('The selected JAR has no Forge mod metadata.')
    def metadata = archive.getInputStream(entry).withCloseable { it.getText('UTF-8') }
    def coreModVersion = null
    def modTables = metadata =~ /(?ms)^\s*\[\[mods\]\]\s*(.*?)(?=^\s*\[\[|\z)/
    modTables.each { table ->
        if (table[1] =~ /(?m)^\s*modId\s*=\s*["']soulcatcherplus["']/) {
            def versionField = table[1] =~ /(?m)^\s*version\s*=\s*["']([^"']+)["']/
            if (versionField.find()) coreModVersion = versionField.group(1)
        }
    }
    if (coreModVersion == '${file.jarVersion}') coreModVersion = archive.manifest?.mainAttributes?.getValue('Implementation-Version')
    if (coreModVersion != core_version) {
        throw new GradleException("Expected Soul Catcher Plus ${core_version} for Minecraft ${minecraft_version}; selected JAR declares ${coreModVersion ?: 'no soulcatcherplus mod'}.")
    }
}

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            args '--mixin', 'soulcatcherplus_compat.mixins.json'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        register('client')

        register('server') {
            args '--nogui'
        }

        register('gameTestServer')

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', mod_id, '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it) // In Kotlin, it = this
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.3-66.1.5')
    implementation files(coreJar)
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.6'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

tasks.withType(JavaCompile).configureEach {
    // Use the UTF-8 charset for Java compilation
    // This is done by default in Java 18+, but this ensures it no matter the Java or Gradle version
    options.encoding = 'UTF-8'
}

def releaseVersion = providers.gradleProperty('mod_version').get()
def requiredCoreVersion = providers.gradleProperty('core_version').get()
tasks.named('processResources', ProcessResources).configure {
    inputs.properties(mod_version: releaseVersion, core_version: requiredCoreVersion)
    filesMatching('META-INF/mods.toml') { expand mod_version: releaseVersion, core_version: requiredCoreVersion }
}
tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Xmaxerrs', '1500'] }
tasks.named('jar', Jar).configure {
    manifest { attributes 'Implementation-Version': releaseVersion, 'MixinConfigs': 'soulcatcherplus_compat.mixins.json' }
}

tasks.named('test') { useJUnitPlatform() }

// ForgeGradle's merged development output is shared by these tasks. Resource
// restoration must finish first, otherwise cached resources can erase classes.
tasks.named('compileJava') {
    dependsOn tasks.named('processResources')
    outputs.cacheIf { false }
}
tasks.named('processResources') { outputs.cacheIf { false } }
