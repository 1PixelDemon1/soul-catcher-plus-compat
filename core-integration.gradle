// Applied by the matching Soul Catcher Plus checkout. Addon code stays in this repository.
def addonRoot = project.ext.compatAddonDir as File
def addonProperties = new Properties()
new File(addonRoot, 'gradle.properties').withInputStream { addonProperties.load(it) }
if (addonProperties.minecraft_version != minecraft_version || addonProperties.mod_version != mod_version) {
    throw new GradleException("Compatibility addon/core version mismatch: ${addonRoot}. Use the matching branch or -PwithoutCompatAddon.")
}
def addonBuild = new File(addonRoot, "build/${minecraft_version}")
sourceSets {
    compat {
        java.srcDirs = [new File(addonRoot, 'src/main/java')]
        resources.srcDirs = [new File(addonRoot, 'src/main/resources')]
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
configurations {
    compatImplementation.extendsFrom implementation
    compatCompileOnly.extendsFrom compileOnly
    compatAnnotationProcessor.extendsFrom annotationProcessor
    compatRuntimeOnly.extendsFrom runtimeOnly
}
tasks.named('compileCompatJava', JavaCompile).configure {
    destinationDirectory = new File(addonBuild, 'classes/java/main')
}
tasks.named('processCompatResources', ProcessResources).configure {
    destinationDir = new File(addonBuild, 'resources/main')
    inputs.property 'mod_version', mod_version
    filesMatching('META-INF/mods.toml') { expand mod_version: mod_version }
}
minecraft.runs.configureEach {
    mods { soulcatcherplus_compat { source sourceSets.compat } }
    args '--mixin', 'soulcatcherplus_compat.mixins.json'
}
tasks.register('compatJar', Jar) {
    group = 'build'
    description = 'Builds the external combined mod-integration addon.'
    archiveBaseName = 'soulcatcherplus-compat'
    destinationDirectory = new File(addonBuild, 'libs')
    from sourceSets.compat.output
    manifest { attributes 'Implementation-Version': mod_version, 'MixinConfigs': 'soulcatcherplus_compat.mixins.json' }
    finalizedBy 'reobfCompatJar'
}
reobf { compatJar {} }
tasks.named('assemble').configure { dependsOn 'reobfCompatJar' }
